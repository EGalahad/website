name: Deploy documentation hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Missing CLOUDFLARE_PAGES_DEPLOY_HOOK secret'; exit 1; }
          curl --fail --silent --show-error --retry 2 --request POST \
            --output "$RUNNER_TEMP/pages-response.json" "$DEPLOY_HOOK"
